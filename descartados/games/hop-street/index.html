<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Hop Street</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#7ed6df;touch-action:none;overscroll-behavior:none}
  canvas{display:block;position:absolute;left:0;top:0}
  #fx{pointer-events:none}
  :root{--font:"Trebuchet MS","Segoe UI",sans-serif;--ink:#2d3436;--panel:#ffffff;--btn:#f9ca24;--btnInk:#2d3436;--btnShadow:#2d3436;--btnBorder:3px solid #2d3436;--panelBorder:4px solid #2d3436;--panelShadow:0 8px 0 #2d3436;--adBtn:#badc58;--accent:#e74c3c;--pill:rgba(45,52,54,.85);--radius:0;--btnRadius:0}
  .menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;padding:70px 16px 16px}
  .menu h1{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.9;font:900 clamp(54px,13vw,120px) "Trebuchet MS",sans-serif;letter-spacing:2px}
  .menu h1 span{color:#fff;-webkit-text-stroke:4px #2d3436;text-shadow:6px 6px 0 #2d3436}
  .menu h1 span+span{color:#f9ca24}
  .sub{margin:0;font-weight:900;color:#fff;text-shadow:2px 2px 0 #2d3436;font-size:20px}
  .mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px}
  .hud{position:absolute;left:16px;top:60px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  .hud b{font:900 56px "Trebuchet MS";color:#fff;-webkit-text-stroke:3px #2d3436;line-height:1}
  .hud span{font:900 22px "Trebuchet MS";color:#f9ca24;-webkit-text-stroke:1.5px #2d3436}
  .warn{position:absolute;left:50%;top:40%;transform:translateX(-50%);font:900 28px "Trebuchet MS";color:#fff;-webkit-text-stroke:2px #c0392b;opacity:0;pointer-events:none;transition:opacity .1s}
  .sw{width:46px;height:46px;border:4px solid;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff}
  .capsule{width:110px;height:110px;margin:10px auto;border-radius:50%;background:linear-gradient(#e74c3c 50%,#fff 50%);border:5px solid #2d3436;font:900 50px sans-serif;display:flex;align-items:center;justify-content:center;animation:kitWiggle .3s infinite}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<script src="./lib/three.min.js"></script>
<script src="./lib/kit.js"></script>
<script src="./game.js"></script>
</body>
</html>
