<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tasty Factory</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Lilita'; src: url(assets/fonts/lilita.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Nunito'; font-weight: 700; src: url(assets/fonts/nunito-700.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Nunito'; font-weight: 900; src: url(assets/fonts/nunito-900.woff2) format('woff2'); font-display: swap; }
:root {
  --ink: #3a2a22; --ink2: #7a6558; --paper: #fff9f0; --paper2: #f4eadb; --line: #e6d8c4;
  --green: #45c16b; --green-d: #2e9650; --orange: #ff9b2f; --orange-d: #d9731a; --blue: #4aa8ff; --blue-d: #2c7fd1;
  --gold: #ffc93c; --gold-d: #d99a10; --red: #ff6464; --purple: #9b7bff; --purple-d: #7152d6;
  --disabled: #cfc4b6; --disabled-d: #b1a595;
  --r: 16px;
  --display: 'Lilita', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dfcf; color: var(--ink); font-family: var(--body); font-weight: 700; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.ico { display: inline-block; width: 1em; height: 1em; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; flex: none; }

/* chunky game buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; padding: 8px 14px; color: #fff; font-family: var(--display); font-size: 17px; letter-spacing: .3px; background: var(--green); box-shadow: 0 4px 0 var(--green-d), 0 6px 12px rgba(60,40,20,.18); text-shadow: 0 1.5px 0 rgba(0,0,0,.18); transition: transform .06s, box-shadow .06s, filter .15s; white-space: nowrap; }
.btn:active:not(.off) { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-d), 0 2px 6px rgba(60,40,20,.18); }
.btn.orange { background: var(--orange); box-shadow: 0 4px 0 var(--orange-d), 0 6px 12px rgba(60,40,20,.18); }
.btn.orange:active:not(.off) { box-shadow: 0 1px 0 var(--orange-d); }
.btn.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-d), 0 6px 12px rgba(60,40,20,.18); }
.btn.blue:active:not(.off) { box-shadow: 0 1px 0 var(--blue-d); }
.btn.purple { background: var(--purple); box-shadow: 0 4px 0 var(--purple-d), 0 6px 12px rgba(60,40,20,.18); }
.btn.purple:active:not(.off) { box-shadow: 0 1px 0 var(--purple-d); }
.btn.gold { background: var(--gold); color: #6b4200; text-shadow: none; box-shadow: 0 4px 0 var(--gold-d), 0 6px 12px rgba(60,40,20,.18); }
.btn.off { background: var(--disabled); box-shadow: 0 4px 0 var(--disabled-d); color: #fff; cursor: default; }
.btn .ad { width: 18px; height: 18px; --i: url(assets/icons/video.png); }
.btn small { font-family: var(--body); font-weight: 900; font-size: 11px; opacity: .9; }

/* top HUD */
#hud { position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 5; }
.pill { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: rgba(255,249,240,.94); border-radius: 999px; padding: 6px 16px 6px 6px; box-shadow: 0 3px 0 rgba(120,90,60,.18), 0 8px 18px rgba(60,40,20,.12); }
.coin { width: 34px; height: 34px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff3b0 0 18%, #ffd23f 19% 55%, #f2a900 56% 100%); box-shadow: inset 0 -3px 0 rgba(160,90,0,.35), 0 0 0 2px #e8a000; position: relative; }
.coin::after { content: '$'; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); color: #b86f00; font-size: 19px; }
.cashbox { display: flex; flex-direction: column; line-height: 1; min-width: 110px; }
#cash { font-family: var(--display); font-size: 30px; letter-spacing: .5px; }
#inc { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.starpill { padding: 6px 14px 6px 8px; }
.starpill .ico { --i: url(assets/icons/star.png); color: var(--gold); width: 26px; height: 26px; filter: drop-shadow(0 2px 0 var(--gold-d)); }
.starpill b { font-family: var(--display); font-size: 20px; }
.starpill small { color: var(--ink2); font-size: 12px; }
#rushPill { background: linear-gradient(90deg, #ffe3a1, #ffd0e0); display: none; }
#rushPill.on { display: flex; }
#rushPill b { font-family: var(--display); font-size: 17px; color: #b8420d; }
#rushPill .ico { --i: url(assets/icons/fastForward.png); color: #e8590c; width: 22px; height: 22px; margin-left: 6px; }

/* corner buttons */
.round { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,249,240,.94); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(120,90,60,.2), 0 8px 18px rgba(60,40,20,.12); color: var(--ink); font-size: 26px; transition: transform .06s; }
.round:active { transform: translateY(2px); }
#tr { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; gap: 8px; z-index: 5; }

/* goal widget */
#goal { position: absolute; right: max(10px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 58px); z-index: 5; width: 270px; background: rgba(255,249,240,.95); border-radius: var(--r); padding: 10px 12px; box-shadow: 0 3px 0 rgba(120,90,60,.18), 0 8px 18px rgba(60,40,20,.12); display: none; }
#goal.on { display: block; }
#goal .gt { display: flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink2); }
#goal .gt .ico { --i: url(assets/icons/trophy.png); color: var(--orange); width: 16px; height: 16px; }
#goal .gd { font-size: 15px; margin: 4px 0 6px; line-height: 1.2; }
#goal .gb { height: 10px; background: var(--paper2); border-radius: 99px; overflow: hidden; }
#goal .gb i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius: 99px; transition: width .3s; }
#goal .gr { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--ink2); }
#goal .gr b { color: var(--ink); }
#goal .btn { width: 100%; margin-top: 8px; font-size: 16px; padding: 7px; }
#goal.done { animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 3px 0 rgba(120,90,60,.18), 0 0 0 0 rgba(255,180,40,.0); } to { box-shadow: 0 3px 0 rgba(120,90,60,.18), 0 0 0 6px rgba(255,180,40,.45); } }

/* line cards */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.card { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 8px; width: 300px; padding: 7px 8px 7px 7px; background: rgba(255,249,240,.96); border-radius: 18px; box-shadow: 0 3px 0 rgba(120,90,60,.2), 0 10px 22px rgba(60,40,20,.16); will-change: transform; }
.card .th { width: 58px; height: 58px; border-radius: 13px; flex: none; display: grid; place-items: center; position: relative; }
.card .th img { width: 54px; height: 54px; }
.card .th .lv { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-family: var(--display); font-size: 12px; padding: 1px 7px 2px; border-radius: 99px; white-space: nowrap; letter-spacing: .3px; }
.card .mid { flex: 1; min-width: 0; }
.card .nm { font-family: var(--display); font-size: 17px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .bar { position: relative; height: 20px; margin-top: 4px; background: var(--paper2); border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.05); }
.card .bar i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(180deg, #7fe095, var(--green)); border-radius: 99px; }
.card .bar i.fast { transform: none; background: repeating-linear-gradient(-45deg, #7fe095 0 10px, var(--green) 10px 20px); background-size: 28px 28px; animation: slide .5s linear infinite; }
@keyframes slide { to { background-position: 28px 0; } }
.card .bar span { position: relative; display: flex; justify-content: space-between; padding: 0 8px; font-size: 12.5px; line-height: 20px; color: var(--ink); font-weight: 900; }
.card .ms { height: 5px; margin-top: 5px; background: var(--paper2); border-radius: 9px; overflow: hidden; }
.card .ms i { display: block; height: 100%; width: 0; background: var(--purple); border-radius: 9px; }
.card .msl { font-size: 11px; color: var(--ink2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .up { min-width: 84px; flex-direction: column; gap: 0; padding: 5px 8px 6px; line-height: 1.05; }
.card .up b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.card .hire { position: absolute; top: -12px; right: 10px; font-size: 12px; padding: 3px 9px 4px; border-radius: 99px; gap: 4px; }
.card .hire .ico { --i: url(assets/icons/singleplayer.png); width: 13px; height: 13px; }
.card.locked { background: rgba(244,236,224,.94); }
.card.locked .th img { filter: grayscale(1) opacity(.55); }
.card.locked .nm { color: var(--ink2); }
.card.locked .lk { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; color: var(--ink2); }
.card.locked .lk .ico { --i: url(assets/icons/locked.png); width: 13px; height: 13px; }
.card .glowring { position: absolute; inset: -4px; border-radius: 22px; border: 3px solid var(--gold); pointer-events: none; animation: ring 1s ease-in-out infinite; display: none; }
.card.hint .glowring { display: block; }
@keyframes ring { 50% { opacity: .35; transform: scale(1.02); } }
.tapme { position: absolute; left: 0; top: 0; pointer-events: none; transform: translate(-50%, -50%); z-index: 4; }
.tapme div { background: #fff; color: var(--ink); font-family: var(--display); font-size: 15px; padding: 6px 12px; border-radius: 99px; box-shadow: 0 3px 0 rgba(120,90,60,.25); animation: bob 0.9s ease-in-out infinite; white-space: nowrap; }
@keyframes bob { 50% { transform: translateY(-6px) scale(1.04); } }

/* floating numbers */
#floats { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.float { position: absolute; left: 0; top: 0; font-family: var(--display); font-size: 20px; color: #fff; text-shadow: 0 2px 0 #2d7a45, 0 0 6px rgba(0,0,0,.25); white-space: nowrap; animation: rise 1.1s ease-out forwards; }
.float.big { font-size: 28px; color: #ffe066; text-shadow: 0 2px 0 #9a5b00, 0 0 8px rgba(0,0,0,.3); }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -14px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -64px) scale(1); } }
.flycoin { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 30; pointer-events: none; }

/* bottom bar */
#bottom { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 10px; align-items: flex-end; z-index: 6; }
.tab { position: relative; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 7px; border-radius: 16px; background: rgba(255,249,240,.96); box-shadow: 0 4px 0 rgba(120,90,60,.22), 0 8px 18px rgba(60,40,20,.14); font-size: 12px; transition: transform .06s; }
.tab:active { transform: translateY(3px); }
.tab .ico { width: 30px; height: 30px; }
.tab.t-mgr .ico { --i: url(assets/icons/singleplayer.png); color: var(--blue); }
.tab.t-up .ico { --i: url(assets/icons/wrench.png); color: var(--green); }
.tab.t-boost .ico { --i: url(assets/icons/fastForward.png); color: var(--orange); }
.tab.t-star .ico { --i: url(assets/icons/star.png); color: var(--gold); }
.tab .dot { position: absolute; top: -5px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--red); color: #fff; font-size: 12px; line-height: 20px; text-align: center; font-weight: 900; box-shadow: 0 2px 0 #c23b3b; display: none; }
.tab .dot.on { display: block; animation: pop .35s; }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } }
#buymode { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 6; }
#buymode .btn { min-width: 76px; flex-direction: column; gap: 0; line-height: 1; padding: 7px 10px 8px; }
#buymode small { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

/* sheet (side drawer on desktop, bottom sheet on phones) */
#shade { position: absolute; inset: 0; background: rgba(40,25,15,.25); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
#shade.on { opacity: 1; pointer-events: auto; }
#sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 100%); z-index: 21; background: var(--paper); box-shadow: -10px 0 30px rgba(60,40,20,.2); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.9,.3,1.1); }
#sheet.on { transform: none; }
.sh-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 18px; padding-top: max(14px, env(safe-area-inset-top)); }
.sh-head h2 { flex: 1; margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .5px; }
.sh-head .round { width: 42px; height: 42px; font-size: 20px; background: var(--paper2); box-shadow: 0 3px 0 var(--line); }
.sh-head .round .ico { --i: url(assets/icons/cross.png); }
.sh-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; overscroll-behavior: contain; scrollbar-width: thin; touch-action: pan-y; }
.sh-body::-webkit-scrollbar { width: 6px; } .sh-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }
.sh-note { font-size: 13px; color: var(--ink2); margin: 0 4px 12px; line-height: 1.35; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 10px; background: #fff; border-radius: 16px; box-shadow: 0 3px 0 var(--line); }
.row .pic { width: 56px; height: 56px; border-radius: 14px; flex: none; display: grid; place-items: center; overflow: hidden; }
.row .pic img { width: 100%; height: 100%; object-fit: cover; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; }
.row .tx span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.25; margin-top: 2px; }
.row .btn { min-width: 96px; font-size: 16px; }
.row.done { opacity: .75; }
.row.done .btn { background: none; box-shadow: none; color: var(--green-d); text-shadow: none; }
.bigstat { display: flex; gap: 10px; margin-bottom: 12px; }
.bigstat div { flex: 1; background: #fff; border-radius: 16px; padding: 10px 12px; box-shadow: 0 3px 0 var(--line); }
.bigstat small { display: block; font-size: 11px; color: var(--ink2); text-transform: uppercase; letter-spacing: 1px; }
.bigstat b { font-family: var(--display); font-weight: 400; font-size: 26px; }
.sellbox { background: linear-gradient(160deg, #fff4d6, #ffe0ec); border-radius: 18px; padding: 14px; margin-bottom: 16px; box-shadow: 0 3px 0 #efd3b8; }
.sellbox .btn { width: 100%; margin-top: 10px; font-size: 20px; padding: 12px; }
.sellbox .claim { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-size: 34px; margin: 4px 0; }
.sellbox .claim .ico { --i: url(assets/icons/star.png); color: var(--gold); width: 34px; height: 34px; filter: drop-shadow(0 2px 0 var(--gold-d)); }
.h3 { font-family: var(--display); font-size: 18px; margin: 16px 4px 8px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #fff; border-radius: 14px; margin-bottom: 10px; box-shadow: 0 3px 0 var(--line); font-size: 16px; }
.toggle .btn { min-width: 80px; }
.p { font-size: 14px; line-height: 1.45; color: var(--ink); margin: 0 4px 12px; }
.small { font-size: 12px; color: var(--ink2); margin: 16px 4px; line-height: 1.4; }

/* modal (welcome back, etc.) */
.modal { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(40,25,15,.35); padding: 16px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal .box { width: min(380px, 100%); background: var(--paper); border-radius: 24px; padding: 22px 20px 18px; text-align: center; box-shadow: 0 6px 0 var(--line), 0 20px 50px rgba(40,25,15,.35); animation: zoom .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes zoom { from { transform: scale(.7); opacity: 0; } }
.modal h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 6px; }
.modal p { margin: 0 0 12px; color: var(--ink2); font-size: 15px; }
.modal .amt { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--display); font-size: 40px; margin: 8px 0 16px; }
.modal .btns { display: flex; flex-direction: column; gap: 12px; }
.modal .btn { font-size: 20px; padding: 12px; }

/* toasts */
#toasts { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: rgba(58,42,34,.92); color: #fff; padding: 8px 16px; border-radius: 99px; font-size: 15px; animation: tin .3s cubic-bezier(.2,1.4,.4,1), tout .3s 2.2s forwards; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
.toast.gold { background: linear-gradient(90deg, #ffb52e, #ff7fa8); text-shadow: 0 1px 0 rgba(0,0,0,.15); }
@keyframes tin { from { transform: translateY(-12px) scale(.8); opacity: 0; } }
@keyframes tout { to { transform: translateY(-8px); opacity: 0; } }

/* golden crate hit area */
#golden { position: absolute; left: 0; top: 0; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; z-index: 4; display: none; }
#golden.on { display: block; }

/* title & loading */
#title { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 40%, rgba(255,246,232,.55), rgba(233,223,207,.85)); }
#title .logo { font-family: var(--display); font-size: clamp(48px, 11vw, 96px); line-height: .9; text-align: center; color: #fff; letter-spacing: 1px; text-shadow: 0 4px 0 #e0772b, 0 8px 0 #b3531a, 0 14px 24px rgba(90,40,10,.35); transform: rotate(-3deg); }
#title .logo span { display: block; color: #ffd24d; font-size: .62em; text-shadow: 0 4px 0 #d08a00, 0 8px 0 #9c6200, 0 14px 24px rgba(90,40,10,.35); }
#title .btn { font-size: 30px; padding: 14px 54px; border-radius: 18px; }
#title .load { width: 240px; height: 14px; background: rgba(255,255,255,.7); border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
#title .load i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--gold)); transition: width .2s; }
#title .lt { font-size: 14px; color: var(--ink2); }
#title .howto { max-width: 420px; text-align: center; font-size: 14px; color: var(--ink2); line-height: 1.4; padding: 0 20px; }
.hidden { display: none !important; }

/* phones: compact everything */
@media (max-width: 700px), (max-height: 500px) {
  #cash { font-size: 24px; } .coin { width: 28px; height: 28px; } .coin::after { font-size: 16px; }
  .cashbox { min-width: 86px; }
  .starpill b { font-size: 16px; } .starpill .ico { width: 20px; height: 20px; }
  .round { width: 42px; height: 42px; font-size: 22px; }
  .card { width: 262px; padding: 5px 6px 5px 5px; border-radius: 15px; gap: 6px; }
  .card .th { width: 46px; height: 46px; border-radius: 11px; } .card .th img { width: 44px; height: 44px; }
  .card .nm { font-size: 15px; } .card .bar { height: 18px; } .card .bar span { font-size: 11.5px; line-height: 18px; }
  .card .up { min-width: 74px; } .card .up b { font-size: 14px; }
  .card .ms, .card .msl { display: none; }
  .tab { width: 64px; font-size: 11px; padding: 6px 2px 5px; } .tab .ico { width: 26px; height: 26px; }
  #goal { width: 220px; padding: 8px 10px; } #goal .gd { font-size: 13px; }
  #sheet { top: auto; height: 74%; width: 100%; border-radius: 22px 22px 0 0; transform: translateY(105%); }
}
@media (max-width: 700px) and (orientation: portrait) {
  #hud { left: max(10px, env(safe-area-inset-left)); transform: none; flex-direction: column; gap: 6px; }
  #goal { top: auto; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 76px); left: 50%; transform: translateX(-50%); width: min(340px, calc(100% - 20px)); }
  #goal .gr { margin-top: 4px; }
  #bottom { left: max(10px, env(safe-area-inset-left)); transform: none; gap: 6px; }
  #toasts { top: 110px; }
}
/* portrait phones: slim vertical line chips at the bay's left edge, slim goal bar */
.card .th .ring { position: absolute; inset: -4px; border-radius: 16px; padding: 4px; background: conic-gradient(var(--green) calc(var(--p, 0) * 1turn), rgba(0,0,0,.08) 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); display: none; }
body.portrait .card { width: auto; gap: 8px; padding: 6px 6px 6px 7px; border-radius: 16px; }
body.portrait .card .th { width: 44px; height: 44px; border-radius: 12px; }
body.portrait .card .th img { width: 40px; height: 40px; }
body.portrait .card .th .ring { display: block; }
body.portrait .card .th .lv { font-size: 10.5px; bottom: -8px; padding: 0 6px 1px; z-index: 1; }
body.portrait .card .mid { display: none; }
body.portrait .card .up { min-width: 0; width: 64px; padding: 4px 2px 5px; border-radius: 10px; box-shadow: 0 3px 0 var(--green-d); }
body.portrait .card .up.off { box-shadow: 0 3px 0 var(--disabled-d); } body.portrait .card .up.orange { box-shadow: 0 3px 0 var(--orange-d); }
body.portrait .card .up small { font-size: 9.5px; } body.portrait .card .up b { font-size: 13px; letter-spacing: 0; }
body.portrait .card .hire { top: -13px; left: 50px; right: auto; font-size: 10.5px; padding: 2px 7px 3px; }
body.portrait #goal { top: calc(max(10px, env(safe-area-inset-top)) + 52px); bottom: auto; left: 8px; right: 8px; width: auto; transform: none; display: none; padding: 6px 8px 6px 10px; border-radius: 14px; }
body.portrait #goal.on { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: center; }
body.portrait #goal .gt { display: none; }
body.portrait #goal .gd { grid-column: 1; margin: 0 0 3px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.portrait #goal .gb { grid-column: 1; height: 7px; }
body.portrait #goal .gr { grid-column: 2; grid-row: 1 / span 2; margin: 0; font-size: 11px; flex-direction: column; align-items: flex-end; }

body.portrait #goal .btn { grid-column: 2; grid-row: 1 / span 2; width: auto; margin: 0; font-size: 14px; padding: 6px 12px; }

body.portrait #hud { flex-direction: row; }
body.portrait #toasts { top: 112px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
