<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Ink Swing</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f3ede1;touch-action:none;overscroll-behavior:none}
  canvas{display:block}
  :root{--font:"Courier New",ui-monospace,monospace;--ink:#1c1a17;--panel:#f3ede1;--btn:#f3ede1;--btnInk:#1c1a17;--btnShadow:#1c1a17;--btnBorder:3px solid #1c1a17;--panelBorder:3px solid #1c1a17;--panelShadow:8px 8px 0 #1c1a17;--adBtn:#ff6a2b;--accent:#ff6a2b;--pill:#1c1a17;--radius:2px;--btnRadius:2px}
  .kit-btn{font-weight:900;letter-spacing:.5px}
  .menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:auto;padding:70px 16px 16px}
  .menu h1{margin:0;text-align:center;font:900 clamp(56px,13vw,120px)/.85 "Courier New",monospace;color:#1c1a17;letter-spacing:-4px}
  .menu h1 span{color:#ff6a2b;font-style:italic}
  .sub{margin:0;font-weight:800}
  .mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hud{position:absolute;left:50%;top:60px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;width:min(460px,calc(100% - 24px));font-weight:900;pointer-events:none}
  .prog{flex:1;height:14px;border:3px solid #1c1a17;background:#f3ede1}
  .prog i{display:block;height:100%;background:#ff6a2b}
  .kit-pb .prog{margin:10px 0}
  .lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
  .lv{border:2px solid #1c1a17;background:#f3ede1;font:inherit;padding:6px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#1c1a17}
  .lv b{font-size:18px}.lv small{font-size:10px;min-height:12px}
  .lv.cur{background:#ff6a2b;color:#fff}.lv.lock{opacity:.3}
  h3{margin:10px 0 6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="./lib/kit.js"></script>
<script src="./game.js"></script>
</body>
</html>
