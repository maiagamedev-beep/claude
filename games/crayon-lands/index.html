<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Crayon Lands</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d9d2c0;touch-action:none;overscroll-behavior:none}
  canvas{display:block}
  :root{--font:"Comic Sans MS","Chalkboard SE","Marker Felt","Trebuchet MS",sans-serif;--ink:#2b2b2b;--panel:#fbf8f0;--btn:#fff;--btnInk:#2b2b2b;--btnShadow:#2b2b2b;--btnBorder:3px solid #2b2b2b;--panelBorder:3px solid #2b2b2b;--panelShadow:5px 7px 0 #2b2b2b;--adBtn:#9ccc3d;--accent:#e63946;--pill:#2b2b2b;--radius:14px 20px 12px 22px;--btnRadius:12px 16px 10px 18px}
  .kit-btn:nth-child(3n){--btn:#ffd166}.kit-btn.big{--btn:#e63946;--btnInk:#fff}
  .menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;padding:70px 16px 16px;background:rgba(251,248,240,.55)}
  .menu h1{margin:0;text-align:center;font:900 clamp(50px,12vw,108px)/.88 "Comic Sans MS","Chalkboard SE","Marker Felt",sans-serif;color:#1d7ed6;transform:rotate(-3deg);text-shadow:3px 3px 0 #fbf8f0,6px 6px 0 #2b2b2b}
  .menu h1 span{color:#e63946}
  .sub{margin:0;font-weight:800;font-size:18px}
  .mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hud{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:flex;align-items:center;gap:8px;pointer-events:none;font-weight:900;font-size:16px}
  .hud .bar{flex:1;height:20px;border:3px solid #2b2b2b;border-radius:12px;background:#fbf8f0;position:relative;overflow:hidden}
  .hud .bar i{display:block;height:100%;transition:width .2s}
  .hud .goal{position:absolute;right:6px;top:-1px;font-size:13px}
  .hud .stg,.hud .pc{background:#fbf8f0;border:3px solid #2b2b2b;border-radius:10px;padding:2px 8px;white-space:nowrap}
  .swatch{width:56px;height:36px;background:var(--c);border-radius:8px 14px 6px 12px;border:2px solid #2b2b2b;transform:rotate(-4deg)}
  .lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
  .lv{border:2px solid #2b2b2b;border-radius:10px;background:#fff;font:inherit;padding:6px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#2b2b2b}
  .lv b{font-size:20px}.lv small{font-size:11px;opacity:.7}.lv i{color:#f4a300;font-style:normal;min-height:16px}
  .lv.cur{background:#ffd166}.lv.lock{opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="./lib/kit.js"></script>
<script src="./game.js"></script>
</body>
</html>
