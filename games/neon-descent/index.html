<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Neon Descent</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0833;touch-action:none;overscroll-behavior:none}
  canvas{display:block;position:absolute;left:0;top:0}
  #fx{pointer-events:none}
  :root{--font:"Arial Black","Segoe UI",sans-serif;--ink:#f4ecff;--panel:rgba(18,6,40,.94);--btn:#ff3bd4;--btnInk:#fff;--btnShadow:#6a0f5a;--btnBorder:2px solid #ffb0f0;--panelBorder:2px solid #ff3bd4;--panelShadow:0 0 30px rgba(255,59,212,.5);--adBtn:#27f5ff;--accent:#ff3bd4;--pill:rgba(20,6,40,.7);--scrim:rgba(5,0,15,.6);--radius:6px;--btnRadius:6px}
  .kit-btn.ad{color:#07031a;border-color:#b8fcff}
  .kit-row{background:rgba(255,255,255,.07)!important}
  .kit-cell{background:rgba(255,255,255,.06)!important;border-color:rgba(255,255,255,.2)!important}
  .kit-cell.on{background:rgba(39,245,255,.2)!important}
  .menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:auto;padding:70px 16px 16px;background:radial-gradient(circle,rgba(7,3,26,.2),rgba(7,3,26,.7))}
  .menu h1{margin:0;display:flex;flex-direction:column;align-items:center;font:900 clamp(46px,11vw,100px)/.95 "Arial Black",sans-serif;color:#fff;letter-spacing:4px;text-shadow:0 0 12px #ff3bd4,0 0 30px #ff3bd4;font-style:italic}
  .menu h1 span{color:#27f5ff;text-shadow:0 0 12px #27f5ff,0 0 30px #27f5ff;font-size:.62em;letter-spacing:10px}
  .sub{margin:0;color:#ffb0f0;font-weight:800}
  .mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hud{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;color:#fff;font:900 22px "Arial Black",sans-serif;text-shadow:0 0 8px #ff3bd4;pointer-events:none;white-space:nowrap}
  .hud span{font-size:17px;color:#fff27a;text-shadow:0 0 6px #000}
  .hud .p{padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.4)}.hud .s{color:#27f5ff}.hud .m{color:#ff3bd4}.hud .w{color:#b6ff3b}
  .nb{color:#fff27a;text-shadow:0 0 10px #ff3bd4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<script src="./lib/three.min.js"></script>
<script src="./lib/kit.js"></script>
<script src="./game.js"></script>
</body>
</html>
